<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScamShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-group">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="brand-name">ScamShield</span>
      </div>
      <span class="badge-tag">MV3</span>
    </header>

    <main class="content">
      <div id="initial-state" class="state-card">
        <p class="description">Scan the currently active webpage for potential phishing keywords, suspicious links, and security red flags.</p>
        <button id="scan-btn" class="btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Scan Current Page
        </button>
      </div>

      <div id="loading-state" class="state-card hidden">
        <div class="spinner"></div>
        <p class="loading-text">Analyzing page content & links...</p>
      </div>

      <div id="result-state" class="state-card hidden">
        <div class="result-header">
          <div id="risk-badge" class="risk-badge">LOW</div>
          <div class="score-group">
            <span id="risk-score" class="score-val">0</span>
            <span class="score-max">/100</span>
          </div>
        </div>

        <h3 id="verdict-title" class="verdict-title">Probably Safe</h3>
        <p id="recommendation-text" class="recommendation"></p>

        <div class="red-flags-section">
          <h4 class="flags-heading">Top Red Flags (<span id="flags-count">0</span>)</h4>
          <div id="flags-list" class="flags-list"></div>
        </div>

        <button id="rescan-btn" class="btn-secondary">Scan Again</button>
      </div>

      <div id="error-state" class="state-card hidden">
        <div class="error-box">
          <p id="error-msg"></p>
        </div>
        <button id="error-retry-btn" class="btn-secondary">Try Again</button>
      </div>
    </main>

    <footer class="footer">
      <p>ScamShield Risk Assessment Tool</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
